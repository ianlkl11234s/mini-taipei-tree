# nginx configuration for mini-taipei-trees (Vite SPA on Zeabur)
# - SPA fallback: all non-existent routes -> /index.html
# - gzip compression
# - PMTiles MIME type (application/x-protobuf)
# - Layered cache-control: assets (long, immutable) / index.html (no-cache)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # nginx:alpine non-root 友善；tmp 路徑避免權限問題
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # === Gzip compression ===
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/json application/javascript
             application/x-protobuf
             image/svg+xml;
  gzip_comp_level 6;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === Security headers ===
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # === Cache-control strategies ===

    # 1. index.html: no-cache（每次都向 server 驗證新版本）
    location = /index.html {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 2. /assets/ 內的 hash 檔: 永久 immutable cache
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico|webp)$ {
      add_header Cache-Control "public, immutable, max-age=31536000" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 3. PMTiles 檔（~30MB）: byte-range 支援 + 正確 MIME type
    location ~* \.pmtiles$ {
      types { }
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=86400" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Range" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
      add_header Accept-Ranges "bytes" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # 4. /data 其他靜態資源（JSON 等）: 1 小時
    location ~* ^/data/ {
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # === SPA Fallback ===
    location / {
      try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
  }
}
